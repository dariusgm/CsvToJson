[package]
name = "csv_to_json" # the name of the package
version = "0.1.0"    # the current version, obeying semver
authors = ["Darius Murawski <darius@murawski.blog>"]
edition = "2018"
license = "MIT"

[dependencies]
csv = "1.4.0"
glob = "0.3.4"
rayon = "1.12.0"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11.11"

[dev-dependencies]
criterion = "0.8.2"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[[bench]]
name = "bench_transform"
harness = false

[[bin]]
name = "csv_to_json"
path = "src/main.rs"
